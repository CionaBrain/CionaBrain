[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cionabrain"
version = "0.2.0"
description = "Real-time LIF simulation of the 177-neuron Ciona intestinalis larval CNS"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "numpy==2.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
